name: brain
on:
  schedule:
    - cron: "7,22,37,52 * * * 0-5"   # every 15 min, Sun-Fri (UTC), 24 hours: tracks touches in Asia too
  workflow_dispatch: {}               # lets you press "Run workflow" by hand
permissions:
  contents: write
concurrency:
  group: brain
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # full history: the first run replays every saved levels.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy requests
      - name: Update brain
        run: python brain.py --levels docs/levels.json --out docs/brain.json --backfill-git
      - name: Save results
        run: |
          git config user.name "levels-bot"
          git config user.email "levels-bot@users.noreply.github.com"
          git add docs/brain.json
          git diff --cached --quiet && exit 0
          git commit -m "update brain"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
