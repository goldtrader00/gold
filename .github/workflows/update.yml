name: update-levels
on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"   # every 15 min during US hours (UTC), Mon-Fri
    - cron: "0 12 * * 1-5"         # one pre-market run
  workflow_dispatch: {}            # lets you press "Run workflow" by hand
permissions:
  contents: write
concurrency:
  group: update-levels
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build levels
        run: python gld_levels.py --paxg --out docs --snap-dir snapshots
      - name: Save results
        run: |
          git config user.name "levels-bot"
          git config user.email "levels-bot@users.noreply.github.com"
          git add docs snapshots
          git diff --cached --quiet || git commit -m "update levels"
          git pull --rebase
          git push
